services:
  l2mariadb:
    image: mariadb:10.11
    container_name: l2mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "password"
      MYSQL_DATABASE: "l2jdb"
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - l2_net

  l2adminer:
    image: adminer:latest
    container_name: l2adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - l2mariadb
    networks:
      - l2_net

  l2login:
    image: eclipse-temurin:11-jre
    container_name: l2login
    restart: unless-stopped
    ports:
      - "2106:2106"
      - "9014:9014"
    depends_on:
      - l2mariadb
    networks:
      - l2_net
    command:
      - sh
      - -c
      - |
        apt-get update -qq
        apt-get install -y -qq git mariadb-client > /dev/null
        rm -rf /tmp/repo
        git clone --depth 1 https://github.com/NETOLUIZ/l2korentech.git /tmp/repo
        until mysql -h l2mariadb -u root -ppassword --skip-ssl -e "SELECT 1" > /dev/null 2>&1; do sleep 2; done
        DB_READY=$$(mysql -h l2mariadb -u root -ppassword --skip-ssl -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='acis' AND table_name='spawnlist'" 2>/dev/null)
        if [ "$$DB_READY" != "1" ]; then
          mysql -h l2mariadb -u root -ppassword --skip-ssl --force < /tmp/repo/server/acis/sql/acis_schema_full.sql 2>/dev/null
          mysql -h l2mariadb -u root -ppassword --skip-ssl --force < /tmp/repo/server/acis/sql/custom_triggers.sql 2>/dev/null
          mysql -h l2mariadb -u root -ppassword --skip-ssl --force < /tmp/repo/server/acis/sql/custom_spawns.sql 2>/dev/null
          mysql -h l2mariadb -u root -ppassword --skip-ssl --force -e "INSERT IGNORE INTO acis.buffer_schemes (object_id, scheme_name, skills) SELECT obj_Id, 'warrior', '1086,1242,1077,1268,1068,1040,1036,1035,1045,1204,1240,1087,1062,271,274,275,264,269,304,1363,1243,1259,1304,1352,1353,1354,1356,1397' FROM acis.characters; INSERT IGNORE INTO acis.buffer_schemes (object_id, scheme_name, skills) SELECT obj_Id, 'mage', '1085,1059,1040,1036,1035,1045,1048,1204,1078,1062,1303,1354,273,276,365,264,267,304,1413,1243,1259,1352,1353,1355,1397,1304,1240,1268' FROM acis.characters;" 2>/dev/null
        else
          echo "Banco 'acis' ja inicializado, pulando import do schema (preserva spawns/dados editados em producao)."
        fi
        mkdir -p /opt/acisgame
        cp -r /tmp/repo/server/acis/gameserver/. /opt/acisgame/
        mkdir -p /opt/acisgame/data
        cp -r /tmp/repo/server/acis/datapack/data/. /opt/acisgame/data/
        cp /tmp/repo/server/acis/datapack/data/serverNames.xml /opt/acisgame/serverNames.xml
        cd /opt/acisgame
        exec java -Dfile.encoding=UTF-8 -Xmx256m -cp "bin:lib/*:config" net.sf.l2j.loginserver.LoginServer

  l2game:
    image: eclipse-temurin:11-jre
    container_name: l2game
    restart: unless-stopped
    ports:
      - "7777:7777"
    depends_on:
      - l2mariadb
      - l2login
    networks:
      - l2_net
    command:
      - sh
      - -c
      - |
        apt-get update -qq
        apt-get install -y -qq git mariadb-client > /dev/null
        rm -rf /tmp/repo
        git clone --depth 1 https://github.com/NETOLUIZ/l2korentech.git /tmp/repo
        until mysql -h l2mariadb -u root -ppassword --skip-ssl -e "SELECT 1" > /dev/null 2>&1; do sleep 2; done
        DB_READY=$$(mysql -h l2mariadb -u root -ppassword --skip-ssl -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='acis' AND table_name='spawnlist'" 2>/dev/null)
        if [ "$$DB_READY" != "1" ]; then
          mysql -h l2mariadb -u root -ppassword --skip-ssl --force < /tmp/repo/server/acis/sql/acis_schema_full.sql 2>/dev/null
          mysql -h l2mariadb -u root -ppassword --skip-ssl --force < /tmp/repo/server/acis/sql/custom_triggers.sql 2>/dev/null
          mysql -h l2mariadb -u root -ppassword --skip-ssl --force < /tmp/repo/server/acis/sql/custom_spawns.sql 2>/dev/null
          mysql -h l2mariadb -u root -ppassword --skip-ssl --force -e "INSERT IGNORE INTO acis.buffer_schemes (object_id, scheme_name, skills) SELECT obj_Id, 'warrior', '1086,1242,1077,1268,1068,1040,1036,1035,1045,1204,1240,1087,1062,271,274,275,264,269,304,1363,1243,1259,1304,1352,1353,1354,1356,1397' FROM acis.characters; INSERT IGNORE INTO acis.buffer_schemes (object_id, scheme_name, skills) SELECT obj_Id, 'mage', '1085,1059,1040,1036,1035,1045,1048,1204,1078,1062,1303,1354,273,276,365,264,267,304,1413,1243,1259,1352,1353,1355,1397,1304,1240,1268' FROM acis.characters;" 2>/dev/null
        else
          echo "Banco 'acis' ja inicializado, pulando import do schema (preserva spawns/dados editados em producao)."
        fi
        mkdir -p /opt/acisgame
        cp -r /tmp/repo/server/acis/gameserver/. /opt/acisgame/
        mkdir -p /opt/acisgame/data
        cp -r /tmp/repo/server/acis/datapack/data/. /opt/acisgame/data/
        cp /tmp/repo/server/acis/datapack/data/serverNames.xml /opt/acisgame/serverNames.xml
        cd /opt/acisgame
        sleep 5
        exec java -Dfile.encoding=UTF-8 -Xms512m -Xmx1024m -cp "bin:lib/*:config" net.sf.l2j.gameserver.GameServer

networks:
  l2_net:
    name: l2_net
    external: true

volumes:
  mariadb_data:
    driver: local
