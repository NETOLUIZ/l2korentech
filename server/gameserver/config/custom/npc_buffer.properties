# --------------------
# Section: Buffs Price
# --------------------
ProphetBuffPrice = 1000
SongPrice = 1000
DancePrice = 1000
OrcBuffPrice = 1000
ClanBuffPrice = 2000
PricePerCubic = 2000
PricePerSummonBuff = 2000
PricePerHeroBuff = 5000
PricePerNobleBuff = 5000

# Price for All buffs per class
FullProphetBuffsPrice = 10000
FullDancesPrice = 10000
FullSongsDancePrice = 10000
FullShamanBuffPrice = 10000
FullWarcryerBuffPrice = 10000
FullOverlordBuffPrice = 10000
FullClanBuffsPrice = 15000
FullCubicsPrice = 10000
FullSummonBuffsPrice = 10000
FullHeroBuffsPrice = 20000
FullNobleBuffsPrice = 20000

# The npc buffer can restore CP/HP/MP paying per each  CP/HP/MP point
# Exemple if char hp is 100 to restore all hp will cost PricePerHpPoint x 100 (if set to 1)
PricePerPlayerCpPoint = 1
PricePerPlayerMpPoint = 1
PricePerPlayerHpPoint = 1

# Prices for Summons Restore Points:
PricePerSummonHpPoint = 1
PricePerSummonMpPoint = 1

# Exchange sp for sp scrolls from npc buffer, here is the multiplier.
SpMultiplier = 1

# Enables /disables Npc Buffers Animation (useful for huge players to reduce lag)
# false by default
DisableAnimation = true

# Enables/Disables Npc Buffer While a Siege is in Progress.
DisableNpcBufferDuringSiege = false

# regenerate hp/mp for free when buffed ?
RegenarateStatsForFree = true

# if enable this adena will be taken, else no.
AdenaNeeded = true